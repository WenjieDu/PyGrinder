[build-system]
requires = ["setuptools>=77"]

[project]
name = "pygrinder"
description = "A Python toolkit for introducing missing values into datasets"
authors = [{ name = "Wenjie Du", email = "wenjay.du@gmail.com" }]
dynamic = ["version", "readme", "dependencies"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = [
    "data corruption",
    "incomplete data",
    "data mining",
    "pypots",
    "missingness",
    "partially observed",
    "irregular sampled",
    "partially-observed time series",
    "incomplete time series",
    "missing data",
    "missing values",
    "simulation",
    "pypots",
]

[project.urls]
Source = "https://github.com/WenjieDu/PyGrinder"
Homepage = "https://pypots.com"
Documentation = "https://docs.pypots.com/en/latest/pygrinder.html"
"Bug Tracker" = "https://github.com/WenjieDu/PyGrinder/issues"
Download = "https://github.com/WenjieDu/PyGrinder/archive/main.zip"

[tool.setuptools.packages.find]
exclude = [
    "docs*",
    "requirements*",
    "scripts*",
    "test*",
]

[tool.setuptools.dynamic]
version = { attr = "pygrinder.version.__version__" }
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = { file = "requirements/requirements.txt" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
