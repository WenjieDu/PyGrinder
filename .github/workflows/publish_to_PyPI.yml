name: Publish PyPI Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate without publishing
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event_name == 'release' && !github.event.release.draft) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.sha || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install release tooling
        run: |
          python -m pip install --only-binary=:all: "build==1.6.1" "twine==6.2.0"

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --event-sha "$EVENT_SHA"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python -m twine check dist/*
          python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist
          sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pygrinder-release-dist
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release' && !github.event.release.draft
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pygrinder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pygrinder-release-dist
          path: release

      - name: Verify artifact integrity
        working-directory: release
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(wc -l < SHA256SUMS)" -eq 2
          sha256sum --check SHA256SUMS

      - name: Publish validated distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
